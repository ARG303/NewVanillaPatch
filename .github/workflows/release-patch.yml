name: Publish current bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PATCH_VERSION="$(tr -d '\r\n ' < PATCH_VERSION)"
          LAUNCHER_VERSION="$(tr -d '\r\n ' < LAUNCHER_VERSION)"
          TAG="bundle-p${PATCH_VERSION}-l${LAUNCHER_VERSION}"
          gh release create "$TAG" \
            runtime/xinput1_3.dll \
            runtime/fps_patch.ini \
            launcher/RA3FPSLauncher.exe \
            manifest.json \
            --title "RA3 60 FPS Patch ${PATCH_VERSION} / Launcher ${LAUNCHER_VERSION}" \
            --generate-notes
