name: Update manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PATCH_VERSION"
      - "LAUNCHER_VERSION"
      - "MOD_VERSION"
      - "runtime/**"
      - "launcher/**"
      - "mod/**"
      - ".github/workflows/update-manifest.yml"

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository
        shell: bash
        run: git pull --rebase origin main

      - name: Generate manifest
        shell: bash
        run: |
          PATCH_VERSION="$(tr -d '\r\n ' < PATCH_VERSION)"
          LAUNCHER_VERSION="$(tr -d '\r\n ' < LAUNCHER_VERSION)"
          MOD_VERSION="$(tr -d '\r\n ' < MOD_VERSION)"

          PATCH_DLL_SHA="$(sha256sum runtime/xinput1_3.dll | awk '{print $1}')"
          PATCH_INI_SHA="$(sha256sum runtime/fps_patch.ini | awk '{print $1}')"
          LAUNCHER_SHA="$(sha256sum launcher/RA3FPSLauncher.exe | awk '{print $1}')"
          MOD_SHA="$(sha256sum mod/NewVanilla.zip | awk '{print $1}')"
          MOD_SKU="$(unzip -Z1 mod/NewVanilla.zip | awk -F/ 'tolower($NF) ~ /\.skudef$/ {print $NF; exit}')"

          if [ -z "$MOD_SKU" ]; then
            echo "No .skudef found in mod/NewVanilla.zip"
            exit 1
          fi

          cat > manifest.json <<EOF2
          {
            "patchVersion": "${PATCH_VERSION}",
            "gameVersion": "1.12.3444.25830",
            "targetFps": 60,
            "files": [
              {
                "name": "xinput1_3.dll",
                "url": "https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/runtime/xinput1_3.dll",
                "sha256": "${PATCH_DLL_SHA}"
              },
              {
                "name": "fps_patch.ini",
                "url": "https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/runtime/fps_patch.ini",
                "sha256": "${PATCH_INI_SHA}"
              }
            ],
            "mod": {
              "version": "${MOD_VERSION}",
              "url": "https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/mod/NewVanilla.zip",
              "sha256": "${MOD_SHA}",
              "folder": "NewVanilla",
              "skuDef": "${MOD_SKU}"
            },
            "launcher": {
              "version": "${LAUNCHER_VERSION}",
              "url": "https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/launcher/RA3FPSLauncher.exe",
              "sha256": "${LAUNCHER_SHA}"
            }
          }
          EOF2

      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json is already up to date"
            exit 0
          fi

          git commit -m "Update manifest"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retry $attempt/3..."
            git pull --rebase origin main
            sleep 2
          done

          exit 1
