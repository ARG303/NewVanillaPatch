name: Update manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PATCH_VERSION"
      - "LAUNCHER_VERSION"
      - "runtime/**"
      - "launcher/**"
      - ".github/workflows/update-manifest.yml"

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository
        shell: bash
        run: git pull --rebase origin main

      - name: Generate manifest
        shell: python
        run: |
          import hashlib, json, pathlib

          root = pathlib.Path('.')
          patch_version = (root / 'PATCH_VERSION').read_text(encoding='utf-8').strip()
          launcher_version = (root / 'LAUNCHER_VERSION').read_text(encoding='utf-8').strip()

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          files = []
          for name in ('xinput1_3.dll', 'fps_patch.ini'):
              p = root / 'runtime' / name
              files.append({
                  'name': name,
                  'url': f'https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/runtime/{name}',
                  'sha256': sha256(p),
              })

          launcher_path = root / 'launcher' / 'RA3FPSLauncher.exe'
          manifest = {
              'patchVersion': patch_version,
              'gameVersion': '1.12.3444.25830',
              'targetFps': 60,
              'files': files,
              'launcher': {
                  'version': launcher_version,
                  'url': 'https://raw.githubusercontent.com/ARG303/NewVanillaPatch/main/launcher/RA3FPSLauncher.exe',
                  'sha256': sha256(launcher_path),
              },
          }

          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json

          if git diff --cached --quiet; then
            echo "manifest.json is already up to date"
            exit 0
          fi

          git commit -m "Update manifest"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retry $attempt/3..."
            git pull --rebase origin main
            sleep 2
          done

          echo "Failed to push manifest after 3 attempts."
          exit 1
